<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>SketchX</title>
  <!-- Full-bleed for maskable / apple-touch: paper and contours bleed, artwork sits in the 80% safe zone. -->
  <rect width="512" height="512" fill="#f3e3bf"/>
  <!-- Topo contours, hand-wobbly -->
  <g fill="none" stroke="#1c2c4c" stroke-linecap="round" opacity="0.14" stroke-width="7">
    <path d="M-10 120c58-24 104 6 158-10s92-54 150-46 92 40 140 30 64-24 84-30"/>
    <path d="M-10 236c66-20 112 10 170-6s88-40 146-34 86 34 132 26 60-18 84-22"/>
  </g>
  <g transform="translate(51.2 51.2) scale(0.8)">
  <!-- Dashed property line turning a corner -->
  <path d="M44 318 L170 448 L478 396" fill="none" stroke="#1c2c4c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="16 22"/>
  <!-- Pencil under-sketch that overshoots the marker -->
  <g fill="none" stroke="#1c2c4c" stroke-linecap="round" stroke-width="7" opacity="0.85">
    <path d="M146 60 C204 104 252 150 300 204 S 404 318 454 372"/>
    <path d="M390 54 C334 106 290 152 240 206 S 116 330 60 394"/>
    <path d="M128 78 C140 84 152 92 162 100" stroke-width="5"/>
  </g>
  <!-- Marker X: two rough brush strokes -->
  <g fill="#e0315b">
    <path d="M142 88 Q302 206 421 381 C440 404 404 436 379 423 Q228 280 94 136 C78 114 120 72 142 88 Z"/>
    <path d="M375 85 Q220 234 89 383 C74 404 116 446 139 433 Q286 300 417 127 C432 104 396 70 375 85 Z"/>
  </g>
  </g>
</svg>
