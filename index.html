<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>SketchX</title>
    <meta name="description" content="SketchX — Michigan hunting land map: public land, parcel owners, hunting units, waypoints and GPS tracks. Informational only — not legal advice." />
    <meta name="theme-color" content="#14201a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f3f1ea" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SketchX" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app">
      <div id="map" role="application" aria-label="Map"></div>

      <header id="topbar">
        <button class="brand" id="btn-home" type="button" title="Fit Michigan" aria-label="SketchX — fit Michigan">
          <img src="/icons/icon.svg" alt="" width="32" height="32" />
          <span class="brand-text">
          <svg class="wordmark" viewBox="-4 -10 268 70" width="101" height="26" aria-hidden="true" focusable="false">
            <g fill="none" stroke="currentColor" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" transform="rotate(-4 120 26)">
              <path d="M31 9 C24 2 7 3 7 14 C7 27 33 22 32 36 C31 49 12 50 4 41"/>
              <path d="M44 1 C44 18 43 33 42 48"/>
              <path d="M63 19 C56 25 50 30 44 34 C52 38 58 43 65 49"/>
              <path d="M73 35 C80 35 88 34 95 33 C96 23 88 18 81 19 C72 21 69 33 72 40 C75 49 89 50 97 43"/>
              <path d="M108 5 C107 18 106 30 106 41 C106 48 112 50 118 46"/>
              <path d="M98 20 C104 19 111 18 118 18"/>
              <path d="M142 23 C134 15 121 19 121 33 C121 46 134 51 144 42"/>
              <path d="M154 0 C154 16 153 32 152 48"/>
              <path d="M153 31 C157 22 166 18 172 21 C176 24 175 32 175 48"/>
            </g>
            <g fill="#e0315b" transform="translate(184 -12) scale(0.152)">
              <path d="M142 88 Q302 206 421 381 C440 404 404 436 379 423 Q228 280 94 136 C78 114 120 72 142 88 Z"/>
              <path d="M375 85 Q220 234 89 383 C74 404 116 446 139 433 Q286 300 417 127 C432 104 396 70 375 85 Z"/>
            </g>
          </svg>
          </span>
        </button>
        <form id="search" role="search" autocomplete="off">
          <input id="search-input" type="search" inputmode="search" enterkeyhint="search" placeholder="Search parks, game areas, counties, markups, lat,lon" aria-label="Search state parks, game areas, counties, your markups, or coordinates" aria-autocomplete="list" aria-controls="search-results" aria-expanded="false" />
          <button type="submit" class="icon-btn" aria-label="Go"><svg class="ic"><use href="#i-search" /></svg></button>
        </form>
      </header>

      <!-- Top-left stack: one column, so the readout, recording pill and compass never overlap. -->
      <div id="hud-stack">
        <div id="coord-readout" title="Tap to copy · switch format" role="button" tabindex="0"></div>
        <div id="record-pill" hidden role="button" tabindex="0" aria-label="Track recording — open Track"></div>
        <div id="compass-hud" hidden></div>
      </div>
      <ul id="search-results" role="listbox" aria-label="Search results" hidden></ul>

      <div id="fabs" class="fab-col">
        <button class="fab fab-labelled" id="btn-basemap" type="button" aria-label="Map style: topo, satellite or streets" title="Map style"><svg class="ic"><use href="#i-map" /></svg><span>Style</span></button>
        <button class="fab fab-thumb" id="btn-sat" type="button" aria-label="Switch to satellite" title="Switch to satellite"><img alt="" width="48" height="48" /><span>Satellite</span></button>
        <button class="fab" id="btn-compass" type="button" aria-label="Compass" title="Compass"><svg class="ic"><use href="#i-compass" /></svg></button>
        <button class="fab" id="btn-locate" type="button" aria-label="Show my location" title="My location"><svg class="ic"><use href="#i-locate" /></svg></button>
      </div>

      <div id="north" aria-hidden="false" title="Reset north"></div>
      <div id="draw-hud" hidden></div>
      <div id="crosshair" hidden aria-hidden="true"></div>

      <aside id="panel" class="sheet" data-state="peek" aria-label="Tools">
        <div class="sheet-grip" aria-hidden="true"><span></span></div>
        <nav class="tabs" role="tablist">
          <button role="tab" data-tab="layers" aria-selected="true"><svg class="ic"><use href="#i-layers" /></svg><span>Layers</span></button>
          <button role="tab" data-tab="markups" aria-selected="false"><svg class="ic"><use href="#i-pencil" /></svg><span>Markups</span></button>
          <button role="tab" data-tab="track" aria-selected="false"><svg class="ic"><use href="#i-route" /></svg><span>Track</span></button>
          <button role="tab" data-tab="more" aria-selected="false"><svg class="ic"><use href="#i-more" /></svg><span>More</span></button>
        </nav>
        <div class="sheet-body">
          <section data-pane="layers" role="tabpanel"></section>
          <section data-pane="markups" role="tabpanel" hidden></section>
          <section data-pane="track" role="tabpanel" hidden></section>
          <section data-pane="more" role="tabpanel" hidden></section>
        </div>
      </aside>

      <section id="details" class="sheet card-sheet" data-state="closed" aria-label="Details" aria-live="polite">
        <div class="sheet-grip" aria-hidden="true"><span></span></div>
        <div class="sheet-body" id="details-body"></div>
      </section>

      <button id="legal-link" type="button">Not legal advice</button>
    </div>
    <noscript>SketchX needs JavaScript to show the map.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
